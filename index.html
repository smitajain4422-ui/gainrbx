<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Success | Reward Claimed</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault()); 
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false; 
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; 
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; 
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; 
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        }
    </script>

    <style>
        /* --- CORE THEME & BACKGROUND --- */
        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #030008;
            background-image: radial-gradient(circle at 100% 30%, #2a004d 0%, #030008 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 420px; 
            padding: 20px;
            position: relative;
        }

        /* --- DESKTOP RESPONSIVE SCALING --- */
        @media (min-width: 768px) {
            .app-container { max-width: 600px; padding: 40px; }
            .white-card { padding: 100px 40px 50px 40px !important; border-radius: 50px !important; }
            .css-roblox-logo.logo-lg { width: 120px !important; height: 120px !important; }
            .overlapping-logo { top: -60px !important; }
            .code-display { font-size: 1.5rem !important; padding: 20px !important; }
        }

        /* --- ANIMATIONS --- */
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- CSS SILVER ROBLOX LOGO --- */
        .css-roblox-wrapper {
            display: inline-flex; justify-content: center; align-items: center;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
        }
        .css-roblox-logo {
            background: linear-gradient(135deg, #ffffff 0%, #9ba3af 100%);
            transform: rotate(-12deg); border-radius: 12%;
            -webkit-mask: linear-gradient(#fff, #fff) center/100% 100% no-repeat, linear-gradient(#fff, #fff) center/28% 28% no-repeat;
            -webkit-mask-composite: destination-out;
            mask: linear-gradient(#fff, #fff) center/100% 100% no-repeat, linear-gradient(#fff, #fff) center/28% 28% no-repeat;
            mask-composite: exclude;
        }
        .logo-lg { width: 100px; height: 100px; }

        /* --- WHITE CARD STYLING --- */
        .white-card {
            background-color: #ffffff; border-radius: 40px; padding: 85px 24px 40px 24px; 
            text-align: center; color: #1a1a1a; position: relative; margin-top: 60px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .overlapping-logo {
            position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
        }

        /* --- CODE BOX --- */
        .code-display {
            background-color: #f3f4f6;
            border: 2px dashed #cbd5e1;
            font-family: monospace;
            font-size: 1.25rem;
            font-weight: 700;
            color: #1f2937;
            letter-spacing: 2px;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div id="fake-toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 -translate-y-[150%] opacity-0 transition-all duration-300 z-50 bg-[#10b981] text-white px-6 py-3 rounded-full font-bold shadow-lg flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        Code Copied to Clipboard!
    </div>

    <div class="app-container">
        
        <div class="white-card slide-up">
            
            <div class="overlapping-logo">
                <div class="css-roblox-wrapper"><div class="css-roblox-logo logo-lg"></div></div>
            </div>

            <h2 class="text-3xl font-extrabold mb-4">🎉 Success! 🎉</h2>
            
            <p class="text-[15px] text-gray-700 leading-relaxed font-medium mb-6 md:text-lg">
                Your account is <strong>verified!</strong> You have successfully completed the sponsor activity.<br>
                Here is your <strong>25,000 ROBUX</strong> gift card code:
            </p>

            <div>
                <div class="code-display" id="giftcard-code">GH9S-KS8W-81H1-IW</div>
                
                <button onclick="fakeCopyCode()" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-[#3b0086] to-[#240052] text-white font-bold py-4 rounded-xl hover:brightness-125 transition duration-200 shadow-md mt-2" id="copy-btn">
                    <svg id="copy-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                    </svg>
                    <span id="copy-text">Copy Code</span>
                </button>
            </div>

        </div>
    </div>

    <script>
        function fakeCopyCode() {
            const btnText = document.getElementById('copy-text');
            const btnIcon = document.getElementById('copy-icon');
            const btn = document.getElementById('copy-btn');
            const toast = document.getElementById('fake-toast');

            // Visually change the button
            btnText.innerText = "Copied!";
            btn.style.background = "#10b981"; // Emerald green
            btnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>`;

            // Show fake success toast notification
            toast.classList.remove('-translate-y-[150%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            // Reset everything after 3 seconds
            setTimeout(() => {
                btnText.innerText = "Copy Code";
                btn.style.background = "linear-gradient(to right, #3b0086, #240052)";
                btnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>`;
                
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-[150%]', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
    </html>
